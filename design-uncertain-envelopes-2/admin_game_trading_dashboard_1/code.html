<body class="bg-custom-grey font-mono text-slate-100 min-h-screen flex flex-col overflow-x-hidden antialiased selection:bg-primary selection:text-black">
<header class="flex items-center justify-between p-4 bg-custom-grey/95 sticky top-0 z-50 border-b border-white/5 backdrop-blur-md">
<h1 class="text-sm font-bold uppercase tracking-widest text-primary font-display">UNCERTAIN ENVELOPES</h1>
<div class="flex items-center gap-4">
<button class="flex items-center justify-center text-primary transition-colors">
<span class="material-symbols-outlined filled text-2xl fill-1">account_circle</span>
</button>
</div>
</header>
<main class="flex-1 flex flex-col gap-6 p-6 pb-32 relative z-10">
<section class="flex flex-col gap-2">
<label class="text-xs text-slate-500 uppercase tracking-wider font-bold">Username</label>
<div class="relative group" x-data="{ editing: false, username: 'CryptoKing99' }">
<div class="flex items-center justify-between bg-surface-grey border border-white/10 rounded-xl p-4">
<span class="text-lg font-bold text-white tracking-wide">CryptoKing99</span>
<button class="text-primary hover:text-white transition-colors p-2 rounded-lg hover:bg-white/5">
<span class="material-symbols-outlined text-xl filled">edit</span>
</button>
</div>
</div>
</section>
<section class="flex flex-col gap-2">
<label class="text-xs text-slate-500 uppercase tracking-wider font-bold">Email Address</label>
<div class="flex items-center justify-between bg-surface-grey/50 border border-white/5 rounded-xl p-4 opacity-75">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-500 text-lg filled">lock</span>
<span class="text-base text-slate-300 font-medium truncate">user@example.com</span>
</div>
<span class="text-[10px] text-slate-600 uppercase border border-slate-700 px-2 py-0.5 rounded">Verified</span>
</div>
</section>
<section class="flex flex-col gap-2">
<label class="text-xs text-slate-500 uppercase tracking-wider font-bold">Performance Stats</label>
<div class="grid grid-cols-2 gap-3">
<div class="bg-surface-grey border border-white/10 rounded-xl p-4 flex flex-col items-center justify-center text-center gap-1">
<span class="text-xs text-slate-400 uppercase tracking-wide">Win Rate</span>
<span class="text-2xl font-bold text-primary">68%</span>
</div>
<div class="bg-surface-grey border border-white/10 rounded-xl p-4 flex flex-col items-center justify-center text-center gap-1">
<span class="text-xs text-slate-400 uppercase tracking-wide">Games Played</span>
<span class="text-2xl font-bold text-white">142</span>
</div>
</div>
</section>
<section class="flex flex-col gap-4 mt-4">
<button class="w-full bg-surface-grey hover:bg-surface-grey/80 border border-white/10 text-white h-14 rounded-xl flex items-center justify-between px-6 transition-all active:scale-[0.98] group">
<span class="font-bold uppercase tracking-wide text-sm flex items-center gap-3">
<span class="material-symbols-outlined text-primary">history</span>
                    Game History
                </span>
<span class="material-symbols-outlined text-slate-500 group-hover:text-white transition-colors">chevron_right</span>
</button>
<button class="w-full bg-surface-grey hover:bg-surface-grey/80 border border-white/10 text-white h-14 rounded-xl flex items-center justify-between px-6 transition-all active:scale-[0.98] group">
<span class="font-bold uppercase tracking-wide text-sm flex items-center gap-3">
<span class="material-symbols-outlined text-slate-400">logout</span>
                    Sign Out
                </span>
</button>
<button class="w-full bg-red-900/10 hover:bg-red-900/20 border border-red-500/20 text-red-500 h-14 rounded-xl flex items-center justify-center gap-2 transition-all active:scale-[0.98] mt-4">
<span class="material-symbols-outlined text-xl filled">delete_forever</span>
<span class="font-bold uppercase tracking-wide text-sm">Delete Account</span>
</button>
</section>
</main>
<div class="fixed bottom-0 left-0 right-0 bg-custom-grey border-t border-white/5 z-40 pb-safe">
<div class="flex items-center justify-around p-4 text-slate-500">
<button class="flex flex-col items-center gap-1 hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl filled">home</span>
<span class="text-[10px] uppercase font-bold tracking-wider font-display">Home</span>
</button>
<button class="flex flex-col items-center gap-1 hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl filled">add_circle</span>
<span class="text-[10px] uppercase font-bold tracking-wider font-display">Create</span>
</button>
<button class="flex flex-col items-center gap-1 hover:text-white transition-colors">
<span class="material-symbols-outlined text-2xl filled">list_alt</span>
<span class="text-[10px] uppercase font-bold tracking-wider font-display">Orders</span>
</button>
</div>
