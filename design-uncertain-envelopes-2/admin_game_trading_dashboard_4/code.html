</div>
<div class="flex items-center gap-2">
<div class="flex flex-col items-end gap-1">
<span class="text-primary font-bold text-sm">$150.00</span>
<span class="text-[10px] bg-primary/10 text-primary border border-primary/20 px-1.5 py-0.5 rounded uppercase">Buy</span>
</div>
<button class="ml-2 text-slate-500 hover:text-white">
<span class="material-symbols-outlined">expand_more</span>
</button>
</div>
</div>
</div>
<div class="bg-surface-grey border border-white/10 rounded-xl p-4 ring-1 ring-primary/30 shadow-lg shadow-primary/5 transition-all">

</button>
