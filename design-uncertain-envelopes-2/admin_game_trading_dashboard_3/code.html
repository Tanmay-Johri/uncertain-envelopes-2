<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Authentication Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#40f320",
                        "background-light": "#f6f8f5",
                        "background-dark": "#132210",
                        // Custom charcoal for the specific "deep charcoal" request while respecting theme structure
                        "surface-charcoal": "#1e1e1e",
                        "surface-grey": "#2a2a2a",
                        "custom-bg": "#1F1F1F"
                    },
                    fontFamily: {
                        "display": ["Epilogue", "sans-serif"]
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    }
                }
            }
        };
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: 100dvh;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-custom-bg dark:bg-custom-bg font-display text-slate-100 min-h-screen flex flex-col overflow-x-hidden antialiased selection:bg-primary selection:text-black items-center justify-center p-6">
<header class="absolute top-0 left-0 right-0 p-8 flex justify-center z-10">
<h1 class="text-sm font-bold uppercase tracking-[0.2em] text-primary">Uncertain Envelopes</h1>
</header>
<main class="w-full max-w-md relative z-10">
<div class="bg-surface-grey/50 backdrop-blur-sm rounded-xl border border-white/10 overflow-hidden shadow-2xl">
<div class="flex border-b border-white/10">
<button class="flex-1 py-4 text-sm font-bold text-primary border-b-2 border-primary bg-primary/10 transition-all uppercase tracking-wider">
                    Log In
                </button>
<button class="flex-1 py-4 text-sm font-medium text-slate-500 hover:text-slate-300 transition-colors uppercase tracking-wider hover:bg-white/5">
                    Sign Up
                </button>
</div>
<div class="p-6 sm:p-8 flex flex-col gap-6">
<div class="space-y-2">
<label class="block text-xs font-bold text-slate-400 uppercase tracking-wider" for="email">
                        USERNAME OR EMAIL
                    </label>
<div class="relative group">
<input class="w-full bg-[#1e1e1e] border border-white/10 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="email" placeholder="trader@example.com" type="email"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">mail</span>
</div>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-xs font-bold text-slate-400 uppercase tracking-wider" for="password">
                            Password
                        </label>
<a class="text-[10px] text-primary hover:text-white transition-colors uppercase tracking-wider font-bold" href="#">Forgot?</a>
</div>
<div class="relative group">
<input class="w-full bg-[#1e1e1e] border border-white/10 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all" id="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">lock</span>
</div>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-black h-12 rounded-lg shadow-[0_0_20px_rgba(64,243,32,0.2)] flex items-center justify-center gap-2 transition-all active:scale-95 font-bold uppercase tracking-wide text-sm mt-2">
<span>Log In</span>
<span class="material-symbols-outlined text-lg">login</span>
</button>
</div>
</div>
</main>
<div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[100px]"></div>
</div>
</body></html>
