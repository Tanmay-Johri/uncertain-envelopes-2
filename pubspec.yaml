name: uncertain_envelopes_2
description: "Uncertain Envelopes v2 — a real-time envelope trading game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # Web URL strategy (drops the leading `#` in routes); ships with the
  # Flutter SDK, declared explicitly so `lib/main.dart`'s import is not
  # an implicit transitive.
  flutter_web_plugins:
    sdk: flutter

  # Auth + Backend
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # Data classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.1
  http: ^1.2.0

  # Brand assets (SVG mark in headers / bootstrap)
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.15
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.4

  # Testing
  mocktail: ^1.0.4

  # Launcher / favicon / PWA icons from raster master
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - logo/

  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue-Regular.ttf
        - asset: assets/fonts/Epilogue-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
        - asset: assets/fonts/FiraCode-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraCode-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: logo/app_icon_1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: '#1f1f1f'
  adaptive_icon_foreground: logo/app_icon_1024.png
  web:
    generate: true
    background_color: '#1f1f1f'
    theme_color: '#1f1f1f'
